name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # release-please runs here rather than through the organization's reusable workflow because
  # the binaries job below needs its outputs, which the reusable workflow does not pass on.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      release-id: ${{ steps.release.outputs.id }}
      commit: ${{ steps.release.outputs.sha }}
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PEM }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  # A bedrock release is cut as a draft on a tag release-please has already created (draft
  # and force-tag-creation in release-please-config.json), and a draft raises no release
  # event, so the binaries are built by this job of the same run, which then publishes the
  # draft.
  bedrock-binaries:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/bedrock-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      release-id: ${{ needs.release-please.outputs.release-id }}
      commit: ${{ needs.release-please.outputs.commit }}
